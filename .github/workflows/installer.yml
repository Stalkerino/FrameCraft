name: Installer smoke test
on:
  workflow_dispatch:
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install from source on Linux
        if: runner.os == 'Linux'
        run: sh Install-Linux.sh --no-launch
      - name: Install from source on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/install/windows.ps1 -NoLaunch
      - name: Check installed launcher on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -x .runtime/node/bin/node ]; then
            .runtime/node/bin/node scripts/install/smoke.mjs
          else
            node scripts/install/smoke.mjs
          fi
      - name: Check installed launcher on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (Test-Path .runtime/node/node.exe) {
            & ./.runtime/node/node.exe scripts/install/smoke.mjs
          } else {
            node scripts/install/smoke.mjs
          }
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installer-log-${{ matrix.os }}
          path: .runtime/install.log
          include-hidden-files: true
