name: Verify Windows and Linux
on: [push, pull_request]
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: editor-dist-${{ matrix.os }}
          path: dist/
          retention-days: 1
          if-no-files-found: error
  e2e:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: editor-dist-${{ matrix.os }}
          path: dist/
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      # Playback fixtures use H.264/AAC, which Playwright's Chromium may omit.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: npx playwright install --with-deps firefox
      - run: npm run test:e2e:ci -- --shard=${{ matrix.shard }}/3
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.os }}-${{ matrix.shard }}
          path: test-results/
